[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbpf"
version = "0.1.0"
description = "Particle-belief program filtering experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.45", "peft>=0.13", "datasets>=3"]
test = ["pytest>=8"]

[project.scripts]
pbpf-run = "pbpf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
