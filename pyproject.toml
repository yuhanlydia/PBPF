[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbpf"
version = "0.1.0"
description = "Particle-belief program filtering experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
neural = ["torch>=2.4,<3"]
ml = ["torch>=2.4,<3", "transformers>=4.51,<5", "peft>=0.14,<0.19", "datasets>=3,<5", "accelerate>=1.2,<2", "bitsandbytes>=0.45,<0.49"]
experiment = ["evalplus>=0.3,<0.4", "pyarrow>=18,<24", "pandas>=2.2,<3", "scipy>=1.14,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
pbpf-run = "pbpf.cli:main"
pbpf-iclr = "pbpf.iclr_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["gpu: opt-in GPU integration (never default CI)", "network: opt-in external model/data access (never default CI)"]
