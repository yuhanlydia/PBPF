correction_cells:
  - dataset: runbugrun
    domain: rbr
    model: qwen25_7b
    round: 1
    cache: /ABS/PATH/rbr-qwen25-7b-train-development.json
    model_config: configs/models/qwen2.5-coder-7b.yaml
    previous_adapter: null
    visible: 4
    relevance_strength: 16.0
    alpha: 0.1
    uncertainty_penalty: 0.5
    anchor_beta: 0.03
  - dataset: runbugrun
    domain: rbr
    model: deepseek_6p7b
    round: 1
    cache: /ABS/PATH/rbr-deepseek-6p7b-train-development.json
    model_config: configs/models/deepseek-coder-6.7b.yaml
    previous_adapter: null
    visible: 4
    relevance_strength: 16.0
    alpha: 0.1
    uncertainty_penalty: 0.5
    anchor_beta: 0.03
